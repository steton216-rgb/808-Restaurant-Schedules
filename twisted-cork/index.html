<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Twisted Cork Bistro Schedule</title><style>
:root{--ink:#17202a;--muted:#667085;--line:#d9dee7;--brand:#173b63;--soft:#f4f7fa;--off:#f1f3f5;--work:#eaf2fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}header{text-align:center;margin:4px 0 18px}.logo{display:block;max-width:min(360px,88%);max-height:150px;width:auto;height:auto;object-fit:contain;margin:0 auto 14px;border-radius:8px}h1{font-size:24px;margin:0 0 4px}header p{margin:0;color:var(--muted)}.picker{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.picker label{display:block;font-weight:700;margin-bottom:8px}select,button{font:inherit;font-size:16px;min-height:48px;border-radius:10px}select{width:100%;padding:0 12px;border:1px solid #aeb7c4;background:#fff;color:var(--ink)}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;border:1px solid var(--line);background:#fff;font-weight:700;padding:8px}.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}.week{margin:18px 0 24px}.week h2{font-size:17px;margin:0 0 9px}.cards{display:grid;gap:8px}.day{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 12px}.day .date{font-weight:700}.shift{font-weight:700}.off{color:var(--muted);font-weight:500}.hours{margin-top:9px;text-align:right;font-size:14px;color:var(--muted);font-weight:700}.full{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{padding:8px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}th{background:var(--brand);color:#fff;position:sticky;top:0}td:first-child,th:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:#fff}th:first-child{background:var(--brand)}tr:last-child td{border-bottom:0}.note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.day{grid-template-columns:100px 1fr}}@media print{.picker,.tabs,.note{display:none}.wrap{max-width:none}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><header><img class="logo" src="logo.png" alt="Restaurant logo"><h1>Twisted Cork Bistro</h1><p>Schedule • October 5–18, 2026</p></header><div class="picker"><label for="emp">My Schedule</label><select id="emp"><option value="">Select your name…</option></select></div><div class="tabs"><button id="mine" class="active" type="button">My Schedule</button><button id="team" type="button">Full Team</button></div><main id="out" aria-live="polite"><p style="text-align:center;color:var(--muted);padding:25px 0">Select your name above to see your two-week schedule.</p></main><p class="note">Save this file on your phone and reopen it anytime. No Excel app required.</p></div><script>

"OFF", "OFF", "Bar 5-CL", "OFF", "OFF", "CLOSED", 4], ["Pyper (Host)", "OFF", "OFF", "OFF", "OFF", "OFF", "OFF", "CLOSED", 0], ["Elli (Host)", "OFF", "OFF", "OFF", "OFF", "OFF", "5-CL", "CLOSED", 5], ["Anthony Valiani (Bar)", "Bar 5-CL", "Bar 5-CL", "Bar 5-CL", "OFF", "Bar 5-CL", "Bar 5-CL", "CLOSED", 22]]}], "employees": ["Preston", "Laura", "Jessica", "Mariah", "Becki", "Noah", "Logan Newell", "Priscilla", "Andrew (Bartender)", "Pyper (Host)", "Elli (Host)", "Anthony Valiani (Bar Training)", "Anthony Valiani (Bar)"]};const emp=document.getElementById('emp'),out=document.getElementById('out'),mine=document.getElementById('mine'),team=document.getElementById('team');D.employees.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;emp.appendChild(o)});let mode='mine';function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function isOff(s){return /^(OFF|CLOSED)/i.test(String(s||'').trim())}function myView(){if(!emp.value){out.innerHTML='<p style="text-align:center;color:var(--muted);padding:25px 0">Select your name above to see your two-week schedule.</p>';return}let h='';D.weeks.forEach((w,i)=>{const row=w.rows.find(r=>String(r[0]).trim()===emp.value);if(!row)return;h+='<section class="week"><h2>Week '+(i+1)+' • '+(i?'October 12–18':'October 5–11')+'</h2><div class="cards">';for(let c=1;c<=7;c++){const sh=row[c]??'';h+='<div class="day"><div class="date">'+esc(w.headers[c])+'</div><div class="shift '+(isOff(sh)?'off':'')+'">'+esc(sh)+'</div></div>'}h+='</div><div class="hours">Scheduled hours: '+esc(row[8])+'</div></section>'});out.innerHTML=h}function teamView(){let h='';D.weeks.forEach((w,i)=>{h+='<section class="week"><h2>Week '+(i+1)+' • '+(i?'October 12–18':'October 5–11')+'</h2><div class="full"><table><thead><tr>'+w.headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+w.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'});out.innerHTML=h}function render(){mode==='mine'?myView():teamView()}emp.addEventListener('change',()=>{mode='mine';mine.classList.add('active');team.classList.remove('active');render()});mine.addEventListener('click',()=>{mode='mine';mine.classList.add('active');team.classList.remove('active');render()});team.addEventListener('click',()=>{mode='team';team.classList.add('active');mine.classList.remove('active');render()});
